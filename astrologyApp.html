<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <h1>Astrology Reading</h1>
        
        <form id="astrology-form">
            <!-- Name Input -->
            <div class="input-group">
                <label for="firstName">Name:</label>
                <input type="text" id="name" name = "name" placeholder="Enter your first name" required>
            </div>

            <!-- Surname Input -->
            <div class="input-group">
                <label for="surname">Surname:</label>
                <input type="text" id="surname" name = "surname" placeholder="Enter your surname" required>
            </div>

            <!-- Birth Day Input -->
            <div class="input-group">
                <label for="birthDay">Birth Day:</label>
                <input type="number" id="day" name ="day" min="1" max="31" placeholder="DD" required>
            </div>

            <!-- Birth Month Input -->
            <div class="input-group">
                <label for="birthMonth">Birth Month:</label>
                <input type="number" id="month" name="month" min="1" max="12" placeholder="MM" required>
            </div>

            <!-- Birth Year Input -->
            <div class="input-group">
                <label for="birthYear">Birth Year:</label>
                <input type="number" id="year" name="year" min="1900" max="2026" placeholder="YYYY" required>
            </div>

            <button type="button">Get My Reading</button>
        </form>

        <!-- Result Container -->
        <div class="result" id="resultBox">
            <p>Your astrology result will appear here.</p>
        </div>
    </div>
    <script src="script4.js"></script>
</body>
</html>
